# Weight-lane focus: anchor experiment. Inherits default.yaml; overrides emphasize
# weight/load-cell drift sources and disable other lanes' noise for clean ablation.
# Usage: scripts/run_experiment.py merges this on top of default.yaml.
lane: weight
events:
  p_shrink: 0.02          # more phantom-inventory pressure for the weight story
  p_mis_scan: 0.08
  p_misplace: 0.005       # de-emphasize location drift
  p_ghost_move: 0.0
  p_missed_putaway: 0.0
