# Default experiment configuration for the IoT inventory-reconciliation simulation.
#
# All randomness is driven by `seed`; the experiment runner sweeps multiple seeds
# and reports mean +/- std. Every block below maps to a module: `world`->world.py,
# `events`->events.py, `sensors`->sensors/*, `detectors`->detectors/*,
# `cv_oracle`->cv_oracle.py, `baselines`->baselines.py.

seed: 0

# ---------------------------------------------------------------------------
# World: the physical warehouse the simulator owns ground truth over.
# ---------------------------------------------------------------------------
world:
  n_bins: 40              # storage bins, each holds one SKU's units (load-cell shelf)
  n_zones: 6              # physical zones/racks for location tracking
  n_skus: 25              # distinct SKUs in the catalog
  ticks: 2000             # discrete simulation steps (each ~ one minute of ops)
  init_units_min: 5       # starting on-hand units per bin (uniform low)
  init_units_max: 60      # starting on-hand units per bin (uniform high)
  unit_weight_min: 50.0   # grams per unit, per-SKU (uniform draw)
  unit_weight_max: 800.0  # grams per unit, per-SKU
  unit_weight_cv: 0.03    # unit-to-unit weight variation (coeff. of variation)
  tare_weight: 200.0      # empty-bin tare weight in grams (load cell sees this)

# ---------------------------------------------------------------------------
# Events: what happens each tick. "Logged" events update the WMS/system record;
# "unlogged" events change physical reality WITHOUT a system record => drift.
# Rates are per-tick probabilities (Bernoulli/Poisson-thinned).
# ---------------------------------------------------------------------------
events:
  p_sale: 0.45            # a pick/sale happens this tick (logged when scanned)
  sale_qty_max: 4         # max units per pick
  p_replenish: 0.10       # a putaway/replenishment happens (logged when scanned)
  replenish_qty_max: 30
  p_move: 0.05            # a pallet/tote moves between zones (logged when scanned)

  # Drift sources: probabilities that an event becomes (or is) UNLOGGED.
  # Kept low so the warehouse is mostly correct: this is the realistic regime
  # where most locations are fine and the job is to find the few that drifted.
  # (High drift rates saturate the world and trivially inflate IoT precision.)
  p_mis_scan: 0.03        # a logged-intent event is mis-scanned -> wrong qty or no record
  p_shrink: 0.004         # theft/damage/loss: units leave a bin, no record (phantom inventory)
  p_misplace: 0.006       # putaway to the WRONG zone, system thinks it's elsewhere
  p_ghost_move: 0.004     # asset relocated with no matching WMS move event
  p_missed_putaway: 0.01  # received stock left stranded (dwell anomaly), not put away

# ---------------------------------------------------------------------------
# Process stages (for the dwell-time lane). Expected dwell per stage in ticks.
# ---------------------------------------------------------------------------
process:
  stages: [receiving, staging, outbound]
  expected_dwell:         # nominal dwell (ticks) per stage; lognormal-ish via gamma
    receiving: 20
    staging: 30
    outbound: 15
  dwell_cv: 0.35          # coefficient of variation of nominal dwell
  stranded_dwell_mult: 4.0  # stranded items dwell ~this x longer than expected

# ---------------------------------------------------------------------------
# Sensors: emulate noisy IoT signals on top of true state.
# ---------------------------------------------------------------------------
sensors:
  weight:
    cell_noise_g: 8.0     # gaussian load-cell read noise (grams)
    drift_g_per_tick: 0.05  # slow zero drift of the load cell (grams/tick)
    sample_every: 1       # ticks between weight reads
  location:
    # BLE = cheap, continuous, noisy; UWB = periodic, accurate correction.
    ble_zone_error: 0.18  # P(BLE reports adjacent/wrong zone) per read
    ble_dropout: 0.10     # P(no BLE read this tick)
    uwb_every: 10         # UWB correction every N ticks
    uwb_zone_error: 0.03  # P(UWB wrong zone) per read
  dwell:
    timestamp_jitter: 1   # +/- ticks of noise on stage-entry timestamps

# ---------------------------------------------------------------------------
# Detectors: sequential change/hypothesis tests with explicit error-rate design.
# Each lane's decision boundary is derived from a target error rate rather than a
# hand-set threshold (see src/iotcv/detectors and src/iotcv/stats.py).
# ---------------------------------------------------------------------------
detectors:
  weight:
    # Heteroscedastic GLR-CUSUM on the standardized count innovation. The count
    # estimate n_hat = (w - tau)/mu_s has variance sigma^2 = sigma_cell^2/mu_s^2
    # + c_v^2 * n (grows with stock), so we standardize each innovation before
    # accumulating. The decision interval h is solved from a target in-control
    # average run length (ARL0) via Siegmund's approximation.
    ewma_alpha: 0.3        # light EWMA pre-smoothing of the raw count estimate
    cusum_k: 0.5           # CUSUM reference value (half the target shift, in sigma)
    target_arl0: 500       # in-control mean ticks between false alarms -> sets h
    min_shift_units: 1.0   # only type/emit when the smoothed residual is material
  location:
    # Wald SPRT on per-read zone (mis)match. Each informative read is Bernoulli;
    # we accumulate its log-likelihood ratio between a "misplaced" and a
    # "correct" hypothesis and stop at Wald's A/B bounds set by (alpha, beta).
    sprt_alpha: 0.01       # target type-I error (false accept of "misplaced")
    sprt_beta: 0.05        # target type-II error (miss a real misplacement)
    p_mismatch_correct: 0.18  # P(read mismatches | asset correct)   ~ e_ble
    p_mismatch_misplaced: 0.85 # P(read mismatches | asset misplaced)
  dwell:
    # Gamma survival test: flag stranded when S(d_obs) = Q(kappa, d/theta) falls
    # below eps, consistent with the Gamma dwell model (no Gaussian mismatch).
    survival_eps: 0.02     # tail-probability threshold (approx one-sided alpha)

# ---------------------------------------------------------------------------
# CV projection: parameters of the HYPOTHETICAL CV verifier, used only to
# *project* a post-verification operating point (see metrics.project_post_cv).
# No CV model is executed. These are assumed verifier rates.
# ---------------------------------------------------------------------------
cv_projection:
  accuracy: 0.92          # assumed P(CV confirms | truly discrepant)
  fp_correction: 0.97     # assumed P(CV correctly rejects a false flag)

# ---------------------------------------------------------------------------
# Composition study (scripts/run_composition.py). The CV verifier is modeled as
# a calibrated stochastic oracle whose per-lane confirm/reject rates are seeded
# from the measured CV numbers reported in the paper; the two layers are joined
# on the shared digital twin without executing the CV model.
# `accuracy` = P(CV confirms | location truly discrepant); `fp_correction` =
# P(CV correctly rejects | location not discrepant). The compute budget is the
# per-tick CV-check cap, applied identically to the CV-only and composed arms so
# the three arms are compared at equal verification cost.
# ---------------------------------------------------------------------------
cv_oracle:
  accuracy: 0.92          # P(CV verdict = discrepant | truly discrepant)
  fp_correction: 0.97     # P(CV verdict = correct | not discrepant)

baselines:
  cv_budget_per_tick: 8   # max CV checks/tick (equal budget for CV-only + composed)
