# Dwell-lane focus: process-state / causation. Stranded inventory, process delays.
# Inherits default.yaml; emphasizes missed-putaway / stranding.
lane: dwell
events:
  p_missed_putaway: 0.05  # more stranded inventory
  p_shrink: 0.004
  p_misplace: 0.005
  p_ghost_move: 0.0
process:
  stranded_dwell_mult: 5.0
